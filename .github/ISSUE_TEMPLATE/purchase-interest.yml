name: Purchase request
description: Request the Agent Ops Command Pack purchase link before checkout is connected.
title: "Purchase request: Agent Ops Command Pack"
labels:
  - purchase-interest
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in Agent Ops Command Pack. The suggested launch price is 9 USD or equivalent.

        Checkout is not connected yet, so this issue records buyer intent. Do not post private payment details, email addresses, tokens, or credentials here.
  - type: checkboxes
    id: buyer-intent
    attributes:
      label: Buyer intent
      options:
        - label: I want the full pack and would like a checkout/payment link when available.
          required: true
        - label: I understand the current suggested launch price is 9 USD or equivalent for a solo/internal-use license.
          required: true
  - type: dropdown
    id: license
    attributes:
      label: License type
      options:
        - Solo developer
        - Small team
        - Company/internal workspace
        - Not sure yet
    validations:
      required: true
  - type: input
    id: quantity
    attributes:
      label: Seats or team size
      description: Use a rough number. Do not include private personal details.
      placeholder: "Example: 1 solo seat, 3-person team, internal workspace"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What kind of AI operations workflow do you want to improve?
      placeholder: "Example: incident triage, deploy checks, code review prompts, data correction safety..."
    validations:
      required: true
  - type: dropdown
    id: purchase-readiness
    attributes:
      label: Purchase readiness
      options:
        - Ready to buy when checkout is available
        - Need one question answered first
        - Evaluating for later
    validations:
      required: true
  - type: dropdown
    id: preferred-platform
    attributes:
      label: Preferred checkout platform
      options:
        - Gumroad
        - Payhip
        - Ko-fi
        - GitHub Sponsors
        - Other
        - No preference
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Questions
      description: Any questions before buying?
    validations:
      required: false
